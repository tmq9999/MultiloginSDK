[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
[project]
name = "multilogin-sdk"
version = "0.1.0"
description = "Typed synchronous and asynchronous Multilogin API client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "pydantic>=2,<3"]
[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
markers = ["live: opt-in live Multilogin smoke", "simulation: Postman simulation integration"]
[tool.ruff]
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
[tool.mypy]
python_version = "3.11"
strict = true
